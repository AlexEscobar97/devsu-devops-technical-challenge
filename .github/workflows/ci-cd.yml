
name: Devsu Java CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build, Tests and Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean verify

      - name: Generate Checkstyle report
        run: mvn -B checkstyle:checkstyle

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-quality-reports
          path: |
            target/site/jacoco/
            target/site/checkstyle.html
            target/surefire-reports/
          if-no-files-found: warn

  docker-build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/alexescobar97/devsu-devops-technical-challenge:latest
            ghcr.io/alexescobar97/devsu-devops-technical-challenge:${{ github.sha }}
