
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsu-java
  labels:
    app: devsu-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsu-java
  template:
    metadata:
      labels:
        app: devsu-java
    spec:
      containers:
        - name: devsu-java
          image: ghcr.io/alexescobar97/devsu-devops-technical-challenge:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
